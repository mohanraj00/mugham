<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Support desk</title>
  <link rel="stylesheet" href="../../../src/tokens/tokens.css">
  <link rel="stylesheet" href="../app.css">
  <script type="module" src="support.js"></script>
</head>
<body>
  <header class="bar"><h1>Bike share help desk</h1><p class="muted">Signed in as Alex P., support team. Synthetic data.</p></header>
  <main class="layout" id="main">
    <section class="pane" aria-labelledby="queue-title">
      <h2 id="queue-title">Open tickets</h2>
      <div id="queue"></div>
    </section>
    <section class="pane detail" aria-labelledby="ticket-title">
      <h2 id="ticket-title" tabindex="-1">No ticket open</h2>
      <div id="ticket" class="stack"><p class="muted">Choose a ticket in the queue.</p></div>
    </section>
  </main>
</body>
</html>
