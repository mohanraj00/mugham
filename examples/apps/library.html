<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Library staff</title>
  <link rel="stylesheet" href="../../src/tokens/tokens.css">
  <link rel="stylesheet" href="../../src/styles/page.css">
  <link rel="stylesheet" href="library.css">
  <script type="module" src="library.js"></script>
  <script type="module" src="../frame.js"></script>
</head>
<body>
  <mu-app-shell id="staff">
    <strong slot="top">Library staff</strong>
    <mu-avatar slot="top"></mu-avatar>
    <a id="loan-link" slot="side" href="#loans">Loans</a>
    <a slot="side" href="#staff-guide">Staff guide</a>
    <a slot="side" href="#member-wizard">Add a member</a>
    <mu-breadcrumbs></mu-breadcrumbs>
    <section id="loans" aria-labelledby="loans-title">
      <h1 id="loans-title">Loans</h1>
      <form id="loan-search" aria-label="Loan search">
        <label for="loan-query">Loan title or shelf</label>
        <div class="search-controls">
          <input type="text" id="loan-query">
          <button type="submit" id="search-loans">Search</button>
        </div>
      </form>
      <mu-skeleton id="loan-loading" hidden></mu-skeleton>
      <ul id="loan-list" aria-label="Current loans" aria-live="polite" hidden></ul>
      <mu-empty-state id="loan-empty" hidden>
        <button type="button" id="clear-loan-search" slot="action">Clear search</button>
      </mu-empty-state>
      <mu-pagination hidden></mu-pagination>
    </section>
    <section id="staff-guide" aria-labelledby="staff-guide-title">
      <h2 id="staff-guide-title">Staff guide</h2>
      <p>Check the shelf code before you return a book.</p>
    </section>
    <section id="member-wizard" aria-labelledby="member-wizard-title">
      <h2 id="member-wizard-title">Add a member</h2>
      <mu-steps></mu-steps>
      <mu-progress id="member-progress"></mu-progress>
      <section data-member-step aria-labelledby="member-details-title">
        <h3 id="member-details-title" tabindex="-1">Details</h3>
      </section>
      <section data-member-step aria-labelledby="member-type-title" hidden>
        <h3 id="member-type-title" tabindex="-1">Membership type</h3>
      </section>
      <section data-member-step aria-labelledby="member-review-title" hidden>
        <h3 id="member-review-title" tabindex="-1">Review</h3>
        <dl>
          <dt>Member name</dt>
          <dd id="member-name"></dd>
          <dt>Membership type</dt>
          <dd id="member-type"></dd>
        </dl>
      </section>
    </section>
  </mu-app-shell>
</body>
</html>
