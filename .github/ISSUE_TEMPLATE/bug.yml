name: Reproducible defect
description: Report behavior of a component, the thread or the workbench that differs from its contract.
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Contract, expected and actual behavior
      description: Name the component and its contract, and the concrete difference.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Neutral reproducer and versions
      description: Include the source commit, the browser and its version, the device and the smallest steps. Use invented data. Do not post credentials, customer material or private source.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks and diagnostics
      description: State what ran, with the failures and the skipped checks. Follow SECURITY.md for a possible vulnerability.
